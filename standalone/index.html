<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Matepaper · 个人工具箱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#app{width:100%;height:100%;overflow:hidden}
body{font-family:'Inter','SF Pro','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);transition:background .3s,color .25s}
button,input,textarea,select{font:inherit;border:none;outline:none}button{cursor:pointer;background:none}svg{flex-shrink:0}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
:root{--bg:#f5f5f4;--surface:#fff;--elevated:#f0efee;--hover:#e9e8e7;--ink:#1c1b1a;--ink-soft:#6b6a68;--ink-faint:#a3a2a0;--line:rgba(0,0,0,0.055);--line-strong:rgba(0,0,0,0.1);--shadow:0 4px 16px rgba(0,0,0,0.04);--shadow-lg:0 16px 48px rgba(0,0,0,0.07);--accent:#888;--accent-soft:color-mix(in srgb,#888 8%,transparent);--note:#8a9a8a;--memo:#9a8a7a;--todo:#9a7a7a;--day:#9a9a7a;--reading:#7a8a9a;--pwd:#8a7a9a;--radius-sm:6px;--radius-md:9px;--radius-lg:12px;--radius-xl:16px}
[data-theme="dark"]{--bg:#161615;--surface:#1f1f1e;--elevated:#282827;--hover:#323231;--ink:#e6e5e4;--ink-soft:#979695;--ink-faint:#666564;--line:rgba(255,255,255,0.055);--line-strong:rgba(255,255,255,0.1);--accent:#a0a0a0;--accent-soft:color-mix(in srgb,#a0a0a0 10%,transparent)}
.app-shell{width:100%;height:100%;display:flex;flex-direction:column}
.titlebar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);user-select:none}
.brand-text{font-weight:650;font-size:15px;letter-spacing:-.2px}
.title-actions{display:flex;gap:4px}
.tbtn{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .12s}
.tbtn:hover{background:var(--hover);color:var(--ink)}
.tbtn.active{background:var(--elevated);color:var(--ink)}
.workspace{flex:1;min-height:0;display:flex}
.sidebar{width:210px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.ws-card{padding:12px;margin-bottom:6px;border-radius:var(--radius-lg);border:1px solid var(--line)}
.ws-title{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.ws-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.ws-stat{padding:5px 7px;border-radius:var(--radius-sm);background:var(--elevated);border:1px solid var(--line);font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;gap:1px}
.ws-stat strong{font-size:16px;font-weight:700;color:var(--ink)}
.ws-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.module-nav{display:flex;flex-direction:column;gap:1px;flex:1}
.module-btn{display:grid;grid-template-columns:30px 1fr 24px;gap:8px;align-items:center;padding:7px 8px;border-radius:var(--radius-md);border:1px solid transparent;color:var(--ink-soft);transition:all .1s;text-align:left;position:relative;width:100%;background:transparent;cursor:pointer}
.module-btn::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:transparent;transition:background .15s}
.module-btn:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}
.module-btn.active{background:var(--accent-soft);border-color:var(--line-strong);color:var(--ink)}
.module-btn.active::before{background:var(--ink-soft)}
.module-icon{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:14px}
.ml{font-weight:600;font-size:12px}.md{font-size:10px;color:var(--ink-faint);margin-top:1px}
.module-cnt{height:20px;min-width:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:var(--elevated);color:var(--ink-soft);margin-left:auto}
.heatmap-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:4px 0}
.heatmap-cell{aspect-ratio:1;border-radius:2px;background:var(--elevated)}
.heatmap-cell[data-lv="1"]{background:color-mix(in srgb,var(--ink-soft)30%,transparent)}
.heatmap-cell[data-lv="2"]{background:color-mix(in srgb,var(--ink-soft)50%,transparent)}
.heatmap-cell[data-lv="3"]{background:var(--ink-soft)}
.heatmap-cell[data-lv="4"]{background:var(--ink)}
.heatmap-summary{display:flex;gap:8px;font-size:9px;color:var(--ink-faint);margin-top:2px}
.entry-list-wrap{position:relative;display:flex;flex-shrink:0}
.entry-list{width:280px;min-width:170px;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.resize-handle{position:absolute;right:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:10;display:flex;align-items:center;justify-content:center}
.resize-handle::after{content:'';display:block;width:2px;height:30px;border-radius:999px;background:var(--line-strong);transition:background .12s,height .12s;pointer-events:none}
.resize-handle:hover::after,.resize-handle.active::after{background:var(--ink-soft);height:40px}
.list-header{padding:12px 12px 0;display:flex;align-items:center}
.list-header-left h2{font-size:15px;font-weight:650}
.list-header-left span{font-size:11px;color:var(--ink-faint);margin-left:6px}
.list-controls{padding:8px 10px;display:flex;gap:5px}
.search-wrap{flex:1;display:flex;align-items:center;height:33px;padding:0 9px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line);gap:6px;color:var(--ink-faint)}
.search-wrap input{flex:1;background:none;color:var(--ink);font-size:12px}
.btn{height:33px;padding:0 11px;border-radius:var(--radius-md);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;transition:all .12s}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer}
.btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer}
.btn-small{height:27px;padding:0 9px;font-size:11px}
.entries-scroll{flex:1;overflow-y:auto;padding:0 8px 14px}
.entry-card{width:100%;padding:10px;border-radius:var(--radius-md);border:1px solid transparent;margin-bottom:4px;cursor:pointer;transition:all .12s;text-align:left;background:transparent;display:flex;flex-direction:column;gap:4px}
.entry-card:hover{background:var(--surface);border-color:var(--line)}
.entry-card.selected{background:var(--accent-soft);border-color:var(--line-strong)}
.entry-ttl{font-weight:600;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:4px}
.entry-pv{font-size:11px;color:var(--ink-soft)}
.entry-mt{font-size:10px;color:var(--ink-faint)}
.empty-st{display:flex;align-items:center;justify-content:center;min-height:100px;border:1px dashed var(--line);border-radius:var(--radius-md);color:var(--ink-faint);font-size:12px}
.editor-pane{flex:1;min-width:0;padding:20px 28px;overflow-y:auto;background:var(--bg)}
.editor-empty{display:flex;align-items:center;justify-content:center;min-height:100%;color:var(--ink-faint);font-size:13px}
.editor-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.editor-badge{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--elevated);color:var(--ink-soft)}
.editor-tti{width:100%;font-size:20px;font-weight:650;background:none;color:var(--ink);padding:0 0 6px;letter-spacing:-.3px}
.editor-body{width:100%;min-height:160px;background:none;color:var(--ink);font-size:13px;line-height:1.7;resize:vertical;padding:0;border:none}
.set-pane{width:400px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);animation:slideSet .25s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideSet{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
.set-pane-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.set-pane-hdr h3{font-size:14px;font-weight:600}
.set-pane-body{padding:14px 18px;overflow-y:auto;flex:1}
.set-pane-body h4{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:8px;margin-top:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row label{font-size:13px;font-weight:450}
.set-row .sh{font-size:10px;color:var(--ink-faint)}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--elevated);border:1px solid var(--line);position:relative;cursor:pointer;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--ink);border-color:var(--ink)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle.on::after{transform:translateX(16px)}
.cdd{position:relative;display:inline-block}
.cdd-t{display:flex;align-items:center;gap:4px;padding:4px 7px 4px 9px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:500;cursor:pointer;transition:all .1s;white-space:nowrap}
.cdd-t:hover{border-color:var(--ink-soft)}
.cdd-t.open{border-color:var(--ink-soft);background:var(--elevated);box-shadow:0 0 0 2px var(--accent-soft)}
.cdd-a{transition:transform .12s;color:var(--ink-soft);flex-shrink:0}
.cdd-t.open .cdd-a{transform:rotate(180deg)}
.cdd-m{position:absolute;top:100%;right:0;margin-top:2px;min-width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow);z-index:100;overflow:hidden;display:none}
.cdd.open .cdd-m{display:block}
.cdd-o{display:block;width:100%;padding:5px 10px;text-align:left;font-size:11px;font-weight:450;color:var(--ink);transition:background .08s;white-space:nowrap;border:none;background:transparent;cursor:pointer}
.cdd-o:hover{background:var(--hover)}.cdd-o.sel{background:var(--accent-soft);font-weight:600}
.range-wrap{display:flex;align-items:center;gap:8px;flex:1;max-width:160px}
.range-wrap input[type="range"]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--hover);border-radius:2px;outline:none;cursor:pointer}
.range-wrap input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer}
.range-wrap span{font-size:11px;color:var(--ink-soft);min-width:28px;text-align:right;flex-shrink:0}
.bg-preview{width:100%;height:54px;border-radius:var(--radius-md);border:1px solid var(--line);overflow:hidden;background-size:cover;background-position:center;margin-bottom:6px;position:relative}
.bg-preview .bg-clear{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:none}
</style>
</head>
<body><div id="app"></div>
<script src="app.js"></script>
</body>
</html>
